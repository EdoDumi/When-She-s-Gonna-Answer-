<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phantom by Paco Rabanne</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #0d0d0d;
      color: #ffffff;
      overflow-x: hidden;
      line-height: 1.6;
    }

    .hero {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url('https://www.pacorabanne.com/media/wysiwyg/PHANTOM_PAGE_BANNER.jpg') center/cover no-repeat;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-shadow: 0 2px 15px rgba(0,0,0,0.8);
      text-align: center;
      position: relative;
    }

    .hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      letter-spacing: 4px;
      color: #ffffff;
      margin-bottom: 1rem;
      animation: fadeInDown 1.5s ease;
    }

    .hero h2 {
      font-weight: 300;
      font-size: 1.6rem;
      max-width: 600px;
      animation: fadeInUp 1.5s ease;
      margin-bottom: 1.5rem;
    }

    .scroll-down {
      position: absolute;
      bottom: 160px;
      cursor: pointer;
      font-size: 2rem;
      color: #ffffff;
      animation: bounce 2s infinite;
      transition: transform 0.2s;
    }

    .scroll-down:hover {
      transform: scale(1.1);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(10px); }
    }

    .section {
      padding: 4rem 2rem;
      text-align: center;
    }

    .video-button {
      display: inline-block;
      background: linear-gradient(45deg, #4c4c4c, #666666);
      color: #ffffff;
      padding: 1.2rem 2.5rem;
      margin: 1rem;
      border-radius: 40px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .video-button::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #ffffff, #dddddd);
      transition: all 0.3s ease;
      z-index: -1;
      transform: scaleX(0);
      transform-origin: right;
    }

    .video-button:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .video-button:hover {
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
    }

    .cta-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
    }

    .cta-buttons a {
      display: inline-block;
      padding: 1.2rem 2.5rem;
      font-weight: bold;
      text-decoration: none;
      border-radius: 40px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .cta-buttons a:first-child {
      background: linear-gradient(to right, #ffffff, #dcdcdc);
      color: #000000;
      box-shadow: 0 0 12px #ffffff80;
    }

    .cta-buttons a:last-child {
      background: linear-gradient(to right, #1a1a1a, #000000);
      color: #ffffff;
      box-shadow: 0 0 12px #00000080;
    }

    .cta-buttons a:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #ffffff60;
    }

    .footer {
      padding: 2rem;
      font-size: 0.8rem;
      background-color: #1a1a1a;
      color: #aaa;
      text-align: center;
    }

    .footer a {
      color: #aaa;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @keyframes fadeInDown {
      0% { opacity: 0; transform: translateY(-30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2.8rem;
      }

      .hero h2 {
        font-size: 1.2rem;
      }

      .video-button, .cta-buttons a {
        width: 90%;
        padding: 1rem;
      }

      .cta-buttons {
        flex-direction: column;
        gap: 1.5rem;
      }
    }
  </style>
  <script>
    function scrollToNextSection() {
      const nextSection = document.querySelector('.section');
      if (nextSection) {
        nextSection.scrollIntoView({ behavior: 'smooth' });
      }
    }
  </script>
</head>
<body>

  <section class="hero">
    <h1>PHANTOM</h1>
    <h2>Choose your side</h2>
    <div class="scroll-down" onclick="scrollToNextSection()">↓</div>
  </section>

  <section class="section">
    <a class="video-button" href="https://www.youtube.com/watch?v=dHQsfZnI-u0" target="_blank">🎥 Watch the official video</a>
  </section>

  <section class="section cta-buttons">
    <a href="https://www.rabanne.com/ww/it/fragrance/p/phantom--000000000065158923" target="_blank">🛒 Eau de Toilette</a>
    <a href="https://www.rabanne.com/ww/it/fragrance/p/phantom-parfum--000000000065188737" target="_blank">🛒 PARFUM</a>
  </section>

  <section class="section">
    <h2>#WeArePhantom</h2>
    <p>Share your side on Instagram and TikTok.</p>
  </section>

  <footer class="footer">
    <p>
      <a href="https://www.rabanne.com" target="_blank">Paco Rabanne ©</a> |
      <a href="https://www.rabanne.com/ww/en/legal-notices" target="_blank">Terms and Conditions</a> |
      <a href="https://www.rabanne.com/ww/en/privacy-policy" target="_blank">Privacy</a> |
      <a href="https://www.rabanne.com/ww/en/contact-us" target="_blank">Contacts</a>
    </p>
  </footer>

</body>
</html>
